[package]
name = "tarmac-app"
version = "0.13.0"
description = "Tarmac cockpit — Tauri 2 + xterm.js UI"
authors = ["Tarmac"]
edition = "2021"

# This crate is a STANDALONE Cargo package — deliberately NOT a member of the
# `core/` workspace. It path-depends on `tarmac-protocol` (a member of that
# workspace) read-only: Cargo resolves that crate's `*.workspace = true` keys
# against core/Cargo.toml (found by walking up from its own location), so the
# wire codec + 9 conformance vectors are REUSED, never re-ported. Do not add
# this package to core/Cargo.toml `members` — that would be editing core and
# would pull Tauri's heavy dep tree into the daemon build.

[lib]
# The `_lib` suffix keeps the lib name unique vs the bin name (Windows quirk,
# see rust-lang/cargo#8519).
name = "tarmac_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SIGTERM by pid: std has no `kill`. libc is already in our transitive tree
# (tokio/tauri); declaring it directly lets the bridge signal a daemon it did
# not spawn (the brew-upgrade case).
libc = "0.2"
# tarmac-card:// path decoding (card_protocol.rs) — already in the tree
# transitively via tauri; declared explicitly since we call it directly.
percent-encoding = "2"

# The ⌘Q guard (#171). tao has no applicationShouldTerminate:, so the only
# place to intercept a keyboard Quit is the native menu item itself: these are
# the AppKit pieces that retarget it, read the key state while Q is held, and
# draw the notice. All five crates are already in Cargo.lock at these versions
# (tao/muda/wry pull them); declared here because we call them directly, with
# features listed explicitly so a dependency dropping one is a build error.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSResponder",
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSEvent",
    "NSWindow",
    "NSPanel",
    "NSGraphics",
    "NSScreen",
    "NSView",
    "NSControl",
    "NSTextField",
    "NSText",
    "NSFont",
    "NSColor",
    "NSBox",
    "NSAccessibilityConstants",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSNotification",
    "NSDictionary",
    "NSObject",
    "NSValue",
    "NSGeometry",
    "objc2-core-foundation",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
] }

# Reused read-only from core/ — gives us the Msg enum, encode/decode,
# frame::read_async/write_async (feature = "async"), repo_color_index, and the
# channel-path resolvers. Its cargo tests already cover conformance V1–V9.
tarmac-protocol = { path = "../../core/crates/tarmac-protocol", features = ["async"] }

# The socket bridge (Phase 1) runs the daemon read/write loops on Tokio, mirroring
# tarmacd's own async IO so frame::read_async/write_async apply directly.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "io-util",
    "time",
] }

[dev-dependencies]
# `test-util` gives the bridge's reply-deadline test a paused clock, so the
# bounded wait is asserted without spending its real 2 s.
tokio = { version = "1", features = ["test-util"] }
