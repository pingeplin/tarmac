<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- A doc's raw HTML is kept as written but never runs: the page's own script
     is injected by the app outside this policy. It may frame a web page, as in
     the Tauri app, and nothing else: a tarmac-card: document framed here would
     not be sandboxed. -->
<meta http-equiv="Content-Security-Policy" content="script-src 'none'; object-src 'none'; frame-src http: https:">
<style>
  /* The prose rules are the Tauri doc card's (desktop/src/theme/card.css). The
     web view is laid out at the card's on-screen size, so --zoom is the board
     zoom and --card-w the card's world width. */
  :root {
    /* The app puts the theme's colours and its colour scheme here before the
       page is loaded, and sets them again when the theme changes. */
    /*tarmac-theme*/
    /* The app sets the three to the chosen fonts once the page has loaded. */
    --chrome-font: ui-monospace, monospace;
    --prose-font: -apple-system, "SF Pro Text", system-ui, sans-serif;
    --prose-size: 14px;
    --oversample-k: 3;
    --zoom: 1;
    --card-w: 392px;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg1);
    color: var(--text);
    font-family: var(--chrome-font);
    font-size: 12px;
    -webkit-font-smoothing: auto;
  }
  .doc-scroll {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    /* The card draws the scroll position itself. */
    scrollbar-width: none;
  }
  /* Not transformed: its height is the prose's visual height, so the scroll
     range is what is seen and the K-times layout is clipped in real pixels. */
  .doc-prose-sizer {
    overflow: hidden;
  }
  .doc-prose-scaler {
    transform-origin: 0 0;
    transform: scale(calc(var(--zoom) / var(--oversample-k)));
  }
  /* Laid out once at K times its size and never by --zoom, so a zoom cannot
     move a wrap point; the scaler brings it down, which is never an upsample. */
  .doc-prose {
    width: calc(var(--card-w) * var(--oversample-k));
    max-width: calc(720px * var(--oversample-k));
    padding: calc(18px * var(--oversample-k)) calc(22px * var(--oversample-k));
    color: var(--prose-text);
    font-family: var(--prose-font);
    font-size: calc(var(--prose-size) * var(--oversample-k));
    line-height: 1.7;
  }
  .doc-prose h1,
  .doc-prose h2,
  .doc-prose h3 {
    color: var(--text);
    line-height: 1.3;
  }
  .doc-prose a {
    color: var(--agent);
    text-decoration: none;
    border-bottom: 1px dashed var(--agent);
  }
  .doc-prose ul,
  .doc-prose ol {
    padding-inline-start: 2.857em;
  }
  .doc-prose blockquote {
    margin-inline: 2.857em;
  }
  .doc-prose code {
    background: var(--bg2);
    padding: 0.08em 0.4em;
    border-radius: 0.32em;
    font-family: var(--chrome-font);
    font-size: 0.8929em;
  }
  .doc-prose pre {
    background: var(--term-bg);
    padding: 0.8571em 1em;
    border-radius: 0.5714em;
    overflow: visible;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .doc-prose pre code {
    background: none;
    padding: 0;
  }
  /* An image's authored size is in CSS px while the prose is K times that. */
  .doc-prose img {
    zoom: var(--oversample-k);
    max-width: 100%;
  }
  .doc-prose ::selection {
    background: var(--agent-dim);
  }
</style>
</head>
<body>
<div class="doc-scroll" id="scroll">
  <div class="doc-prose-sizer" id="sizer">
    <div class="doc-prose-scaler">
      <div class="doc-prose" id="prose"></div>
    </div>
  </div>
</div>
</body>
</html>
