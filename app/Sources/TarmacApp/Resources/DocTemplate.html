<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- A doc's raw HTML is kept as written but never runs: the page's own script
     is injected by the app outside this policy. It may frame a web page, as in
     the Tauri app, and nothing else: a tarmac-card: document framed here would
     not be sandboxed. -->
<meta http-equiv="Content-Security-Policy" content="script-src 'none'; object-src 'none'; frame-src http: https:">
<style>
  /* The prose rules are the Tauri doc card's (desktop/src/theme/card.css). The
     web view is laid out at the card's on-screen size, so --zoom is the board
     zoom, --card-w the card's world width and --text-w the text's: the
     card's less what a sidebar takes. */
  :root {
    /* The app puts the theme's colours and its colour scheme here before the
       page is loaded, and sets them again when the theme changes. */
    /*tarmac-theme*/
    /* The app sets the three to the chosen fonts once the page has loaded. */
    --chrome-font: ui-monospace, monospace;
    --prose-font: -apple-system, "SF Pro Text", system-ui, sans-serif;
    --prose-size: 14px;
    --oversample-k: 3;
    --zoom: 1;
    --card-w: 392px;
    --text-w: var(--card-w);
    /* Where the text starts, in world px: the page sets it, and the rest of
       the sidebar's places, from the app's state. Until then the text starts
       at the card's edge and the sidebar's parts are hidden. */
    --side-offset: 0px;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg1);
    color: var(--text);
    font-family: var(--chrome-font);
    font-size: 12px;
    -webkit-font-smoothing: auto;
  }
  .doc-scroll {
    position: absolute;
    inset: 0;
    left: calc(var(--side-offset) * var(--zoom));
    overflow-y: auto;
    overflow-x: hidden;
    /* The card draws the scroll position itself. */
    scrollbar-width: none;
  }
  /* Not transformed: its height is the prose's visual height, so the scroll
     range is what is seen and the K-times layout is clipped in real pixels. */
  .doc-prose-sizer,
  .doc-side-sizer {
    overflow: hidden;
  }
  .doc-prose-scaler,
  .doc-side-scaler {
    transform-origin: 0 0;
    transform: scale(calc(var(--zoom) / var(--oversample-k)));
  }
  /* Laid out once at K times its size and never by --zoom, so a zoom cannot
     move a wrap point; the scaler brings it down, which is never an upsample.
     The padding centres the text column, measured in the prose's own em; the
     blocks keep normal flow, so their margins still collapse. */
  .doc-prose {
    --gutter: calc(22px * var(--oversample-k));
    width: calc(var(--text-w) * var(--oversample-k));
    padding: calc(18px * var(--oversample-k))
      max(var(--gutter), calc((var(--text-w) * var(--oversample-k) - 46em) / 2));
    color: var(--prose-text);
    font-family: var(--prose-font);
    font-size: calc(var(--prose-size) * var(--oversample-k));
    line-height: 1.7;
  }
  .doc-prose h1,
  .doc-prose h2,
  .doc-prose h3 {
    color: var(--text);
    line-height: 1.3;
  }
  .doc-prose a {
    color: var(--agent);
    text-decoration: none;
    border-bottom: 1px dashed var(--agent);
  }
  .doc-prose ul,
  .doc-prose ol {
    padding-inline-start: 2.857em;
  }
  .doc-prose hr {
    border: 0;
    border-top: calc(1px * var(--oversample-k)) solid var(--line);
  }
  .doc-prose blockquote {
    margin-inline: 2.857em;
  }
  .doc-prose code {
    background: var(--bg2);
    padding: 0.08em 0.4em;
    border-radius: 0.32em;
    font-family: var(--chrome-font);
    font-size: 0.8929em;
  }
  .doc-prose pre {
    background: var(--term-bg);
    padding: 0.8571em 1em;
    border-radius: 0.5714em;
    overflow-x: auto;
    white-space: pre;
  }
  /* Only a direct child breaks out: one inside a list or a quote keeps to
     its container. */
  .doc-prose > .doc-table,
  .doc-prose > pre {
    position: relative;
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    min-width: 100%;
    max-width: min(calc(1040px * var(--oversample-k)), calc(var(--text-w) * var(--oversample-k) - 2 * var(--gutter)));
  }
  .doc-table {
    margin: 1em 0;
    border: calc(1px * var(--oversample-k)) solid var(--line);
    border-radius: calc(8px * var(--oversample-k));
    overflow-x: auto;
  }
  .doc-table table {
    width: 100%;
    border-collapse: collapse;
  }
  .doc-table th,
  .doc-table td {
    padding: calc(8px * var(--oversample-k)) calc(12px * var(--oversample-k));
    text-align: left;
    vertical-align: top;
  }
  .doc-table th[align="center"],
  .doc-table td[align="center"] {
    text-align: center;
  }
  .doc-table th[align="right"],
  .doc-table td[align="right"] {
    text-align: right;
  }
  .doc-table th {
    font-size: 0.82em;
    font-weight: 500;
    color: var(--muted);
    background: var(--bg2);
    white-space: nowrap;
    border-bottom: calc(1px * var(--oversample-k)) solid var(--line);
  }
  .doc-table tbody tr + tr td {
    border-top: calc(1px * var(--oversample-k)) solid var(--line);
  }
  .doc-table th code,
  .doc-table td code {
    white-space: nowrap;
  }
  .doc-table .doc-text-col {
    min-width: calc(220px * var(--oversample-k));
  }
  /* The page hides its own scroll bar; a box that scrolls sideways shows one,
     so the reader sees there is more. */
  .doc-table::-webkit-scrollbar,
  .doc-prose pre::-webkit-scrollbar {
    height: calc(8px * var(--oversample-k));
  }
  .doc-table::-webkit-scrollbar-thumb,
  .doc-prose pre::-webkit-scrollbar-thumb {
    background: var(--muted);
    border-radius: calc(4px * var(--oversample-k));
  }
  .doc-table::-webkit-scrollbar-track,
  .doc-prose pre::-webkit-scrollbar-track {
    background: transparent;
  }
  .doc-prose pre code {
    background: none;
    padding: 0;
  }
  /* An image's authored size is in CSS px while the prose is K times that. */
  .doc-prose img {
    zoom: var(--oversample-k);
    max-width: 100%;
  }
  .doc-prose ::selection {
    background: var(--agent-dim);
  }
  /* The sidebar is laid out at K, as the prose is, inside boxes placed in
     screen px; it scrolls on its own and is never selected. */
  .doc-side-strip,
  .doc-side-panel,
  .doc-side-grip {
    position: absolute;
    top: 0;
    bottom: 0;
    -webkit-user-select: none;
    user-select: none;
  }
  .doc-side-strip {
    left: 0;
    width: calc(var(--side-strip) * var(--zoom));
    overflow: hidden;
    background: var(--bg2);
  }
  .doc-side-panel {
    left: calc(var(--side-panel-start) * var(--zoom));
    width: calc(var(--side-panel) * var(--zoom));
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-width: none;
    background: var(--bg2);
  }
  [data-side="overlay"] .doc-side-panel {
    border-right: calc(1px * var(--zoom)) solid var(--line);
  }
  .doc-side-grip {
    left: calc((var(--side-panel-start) + var(--side-panel)) * var(--zoom));
    width: calc(var(--side-grip) * var(--zoom));
    cursor: col-resize;
    background: linear-gradient(var(--line), var(--line)) 0 0 / calc(1px * var(--zoom)) 100% no-repeat;
  }
  [data-side="overlay"] .doc-side-grip {
    background: none;
  }
  /* On the Right each place is mirrored. No rule here sets the background
     shorthand: it would outrank the overlay grip's `background: none`. */
  :root[data-sidebar-side="right"] .doc-scroll {
    left: 0;
    right: calc(var(--side-offset) * var(--zoom));
  }
  :root[data-sidebar-side="right"] .doc-side-strip {
    left: auto;
    right: 0;
  }
  :root[data-sidebar-side="right"] .doc-side-panel {
    left: auto;
    right: calc(var(--side-panel-start) * var(--zoom));
  }
  :root[data-sidebar-side="right"][data-side="overlay"] .doc-side-panel {
    border-right: 0;
    border-left: calc(1px * var(--zoom)) solid var(--line);
  }
  :root[data-sidebar-side="right"] .doc-side-grip {
    left: auto;
    right: calc((var(--side-panel-start) + var(--side-panel)) * var(--zoom));
    background-position: 100% 0;
  }
  .doc-side-content {
    width: calc(var(--side-panel) * var(--oversample-k));
    padding: calc(14px * var(--oversample-k)) calc(12px * var(--oversample-k)) calc(20px * var(--oversample-k));
    color: var(--prose-text);
    font-family: var(--prose-font);
    font-size: calc(var(--prose-size) * var(--oversample-k) * 0.86);
    line-height: 1.45;
  }
  .doc-side-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.7em;
    letter-spacing: 0.06em;
  }
  .doc-side-head ~ .doc-side-head {
    margin-top: 1.6em;
  }
  .doc-side-close {
    display: none;
    padding: 0 0.3em;
    color: var(--muted);
    cursor: pointer;
  }
  [data-side="docked"] .doc-side-close {
    display: block;
  }
  /* ⇤ points at the edge the panel closes to. */
  :root[data-sidebar-side="right"] .doc-side-close {
    transform: scaleX(-1);
  }
  .doc-field {
    margin-bottom: 0.6em;
  }
  .doc-side-head,
  .doc-field-key {
    color: var(--faint);
    font-family: var(--chrome-font);
    font-size: calc(var(--prose-size) * var(--oversample-k) * 0.75);
  }
  .doc-field-value {
    color: var(--text);
    white-space: pre-line;
    overflow-wrap: anywhere;
  }
  .doc-chip {
    display: inline-block;
    margin: 0.15em 0.35em 0.15em 0;
    padding: 0 0.45em;
    border-radius: calc(4px * var(--oversample-k));
    background: var(--bg3);
    color: var(--text);
    overflow-wrap: anywhere;
  }
  .doc-entry {
    padding: 0.2em 0 0.2em 0.6em;
    border-left: calc(2px * var(--oversample-k)) solid transparent;
    color: var(--muted);
    cursor: pointer;
    overflow-wrap: anywhere;
  }
  .doc-entry[data-depth="2"] {
    padding-left: 1.4em;
  }
  .doc-entry[data-depth="3"] {
    padding-left: 2.2em;
  }
  .doc-entry.current {
    border-left-color: var(--agent);
    color: var(--text);
  }
  /* The icons and ticks keep 6 world px from the card's edge and the ticks
     end 20 above the body's bottom: the card's resize zones. The strip is as
     tall as the view, not as its content, so it has no sizer: its height is
     the view's (100vh) at K. */
  .doc-strip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(6px * var(--oversample-k));
    width: calc(var(--side-strip) * var(--oversample-k));
    height: calc(100vh / var(--zoom) * var(--oversample-k));
    padding: calc(8px * var(--oversample-k)) 0 calc(20px * var(--oversample-k));
    color: var(--muted);
    font-family: var(--chrome-font);
    font-size: calc(12px * var(--oversample-k));
  }
  /* On the Right the card's scroll thumb is over the sidebar's outer edge:
     the strip's icons and ticks and the panel's content keep clear of it, and
     the strip keeps its width. */
  :root[data-sidebar-side="right"] .doc-strip,
  :root[data-sidebar-side="right"] .doc-side-content {
    padding-right: calc(var(--side-thumb-reach) * var(--oversample-k));
  }
  .doc-icon {
    display: flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: calc(18px * var(--oversample-k));
    height: calc(18px * var(--oversample-k));
    border-radius: calc(4px * var(--oversample-k));
    cursor: pointer;
  }
  .doc-icon:hover {
    background: var(--bg3);
    color: var(--text);
  }
  .doc-icon.active {
    background: var(--bg3);
    color: var(--agent);
  }
  /* Three bars 2 world px high with 2 between: legible at zoom 1. */
  .doc-icon-outline::before {
    content: "";
    width: calc(12px * var(--oversample-k));
    height: calc(10px * var(--oversample-k));
    background: repeating-linear-gradient(currentColor 0 calc(2px * var(--oversample-k)), transparent calc(2px * var(--oversample-k)) calc(4px * var(--oversample-k)));
  }
  .doc-ticks {
    display: flex;
    flex: 1;
    flex-direction: column;
    align-items: center;
    min-height: 0;
    overflow: hidden;
    padding-top: calc(4px * var(--oversample-k));
  }
  .doc-tick {
    flex: none;
    width: calc(14px * var(--oversample-k));
    height: calc(7px * var(--oversample-k));
    padding: calc(2.5px * var(--oversample-k)) 0;
    background: var(--line);
    background-clip: content-box;
    cursor: pointer;
  }
  .doc-tick[data-depth="2"] {
    width: calc(9px * var(--oversample-k));
  }
  .doc-tick.lit {
    background-color: var(--agent);
  }
</style>
</head>
<body>
<div class="doc-scroll" id="scroll">
  <div class="doc-prose-sizer" id="sizer">
    <div class="doc-prose-scaler">
      <div class="doc-prose" id="prose"></div>
    </div>
  </div>
</div>
<div class="doc-side-strip" id="strip" hidden>
  <div class="doc-side-scaler">
    <div class="doc-strip" id="strip-content"></div>
  </div>
</div>
<div class="doc-side-panel" id="panel" hidden>
  <div class="doc-side-sizer" id="side-sizer">
    <div class="doc-side-scaler">
      <div class="doc-side-content" id="side-content"></div>
    </div>
  </div>
</div>
<div class="doc-side-grip" id="grip" hidden></div>
</body>
</html>
