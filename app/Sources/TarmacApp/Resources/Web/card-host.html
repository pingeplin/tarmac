<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The host page holds one thing: the card's frame. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src tarmac-card:; style-src 'unsafe-inline'">
<style>
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #2b3036;
  }
  /* White, so an unstyled document reads like a browser default. */
  #card {
    display: block;
    border: 0;
    background: #fff;
    transform-origin: 0 0;
  }
</style>
</head>
<body>
<!-- Scripts at an opaque origin and nothing else: no same-origin access, no
     forms, no popups, no top navigation, no permission-policy feature. -->
<iframe id="card" sandbox="allow-scripts" allow=""></iframe>
</body>
</html>
