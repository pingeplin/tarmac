<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The host page holds one thing: the card's frame. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src tarmac-card:; style-src 'unsafe-inline'">
<style>
  /* The app puts the theme's backdrop here before the page is loaded, and
     sets it again when the theme changes. The page states no scheme of its
     own: the card's document chooses one, and was measured under a host
     with none. */
  :root {
    /*tarmac-backdrop*/
  }
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg1);
  }
  /* White: what a document that states a light scheme, or only its text
     colour, is drawn on. A document that follows the theme paints its own
     canvas over it. */
  #card {
    display: block;
    border: 0;
    background: #fff;
    transform-origin: 0 0;
  }
</style>
</head>
<body>
<!-- Scripts at an opaque origin and nothing else: no same-origin access, no
     forms, no popups, no top navigation, no permission-policy feature. -->
<iframe id="card" sandbox="allow-scripts" allow=""></iframe>
</body>
</html>
