[workspace]
resolver = "3"
members = [
    "crates/tarmac-protocol",
    "crates/tarmacd",
    "crates/tarmac-cli",
]

[workspace.package]
version = "0.24.0"
edition = "2024"

# DO NOT add a `[profile.*]` override of `debug-assertions` (e.g. a build-speed
# `[profile.dev] debug-assertions = false`). Per spec 2606.0003 the daemon/CLI
# channel is keyed on `cfg!(debug_assertions)`; flipping it here would silently
# move a debug build onto the RELEASE socket/state path — reintroducing the
# cross-channel collision and risking release `state.json` corruption — without
# touching any path code.

# One switch makes a warning fail: `make lint` (scripts/check/lint.mjs). The
# entries stay at `warn` so that `cargo test` still runs a `todo!()` stub, the
# first step of a red test. A rule for one crate only is a `#![warn(...)]` at
# that crate's root: cargo refuses a crate that inherits this table and adds to it.
[workspace.lints.rust]
unused_qualifications = "warn"
trivial_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Lock discipline. It sees a guard bound to a local, not one stored in a field.
await_holding_lock = "warn"
# The wire contract: rmp_serde::to_vec is refused in clippy.toml.
disallowed_methods = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"
mem_forget = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
needless_pass_by_value = "warn"
option_option = "warn"
too_many_lines = "warn"
single_match_else = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
map_unwrap_or = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"

[workspace.dependencies]
tarmac-protocol = { path = "crates/tarmac-protocol" }
# serde stack pinned: the rmp-serde tagged-enum + serde_bytes interaction is
# verified on exactly these versions (conformance tests are the tripwire).
serde = { version = "=1.0.228", features = ["derive"] }
rmp-serde = "=1.3.1"
serde_bytes = "=0.11.19"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = "1.52"
tokio-util = "0.7"
portable-pty = "0.9"
# notify pinned to a pre-release: 8.2's FSEvents callback panics on an
# unexpected path or flag and aborts the daemon (#316). Move to 9.0.0 (#318).
notify = "=9.0.0-rc.8"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
