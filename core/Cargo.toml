[workspace]
resolver = "3"
members = [
    "crates/tarmac-protocol",
    "crates/tarmacd",
    "crates/tarmac-cli",
]

[workspace.package]
version = "0.21.0"
edition = "2024"

# DO NOT add a `[profile.*]` override of `debug-assertions` (e.g. a build-speed
# `[profile.dev] debug-assertions = false`). Per spec 2606.0003 the daemon/CLI
# channel is keyed on `cfg!(debug_assertions)`; flipping it here would silently
# move a debug build onto the RELEASE socket/state path — reintroducing the
# cross-channel collision and risking release `state.json` corruption — without
# touching any path code.

[workspace.dependencies]
tarmac-protocol = { path = "crates/tarmac-protocol" }
# serde stack pinned: the rmp-serde tagged-enum + serde_bytes interaction is
# verified on exactly these versions (conformance tests are the tripwire).
serde = { version = "=1.0.228", features = ["derive"] }
rmp-serde = "=1.3.1"
serde_bytes = "=0.11.19"
serde_json = "1"
tokio = "1.52"
tokio-util = "0.7"
portable-pty = "0.9"
# notify pinned to a pre-release: 8.2's FSEvents callback panics on an
# unexpected path or flag and aborts the daemon (#316). Move to 9.0.0 (#318).
notify = "=9.0.0-rc.8"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
