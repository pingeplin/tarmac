[package]
name = "tarmac-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "tarmac"
path = "src/main.rs"

# Agents and hooks call this binary, so it must start fast: a dependency costs
# nothing at start-up. serde_json is here only to merge `tarmac hooks install`
# into an agent's settings and to read a hook's input; `preserve_order` (set in
# the workspace) keeps the user's key order.
[dependencies]
tarmac-protocol.workspace = true
serde_json.workspace = true
