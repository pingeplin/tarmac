[package]
name = "tarmac-protocol"
version.workspace = true
edition.workspace = true

[features]
async = ["dep:tokio"]

[dependencies]
serde.workspace = true
rmp-serde.workspace = true
serde_bytes.workspace = true
tokio = { workspace = true, features = ["io-util"], optional = true }

[dev-dependencies]
serde_json.workspace = true
# The crate's own tests see the `async` frame functions: without the feature a
# test run of this package alone compiles them out, and cargo-mutants runs just
# that (the mutants of frame.rs then pass with no test at all).
tarmac-protocol = { path = ".", features = ["async"] }

[lints]
workspace = true
