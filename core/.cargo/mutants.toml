exclude_re = [
  # The one place that sends a signal. Its mutants signal less, not more, but a
  # mutant here runs with a real pid: it is never tried. arch-check keeps
  # libc::kill in this file.
  "TermHandle::kill\\b",
  # The release twins of a debug-only function: `#[cfg(not(debug_assertions))]`
  # compiles them out of every test build (no profile may set
  # debug-assertions), so no test can run them. Matched by line: the debug
  # twins share the name and their mutants are caught. When the line moves,
  # these come back as survivors and the line here must follow.
  "help\\.rs:229:5: replace dev_forms ",
  "main\\.rs:68:5: replace dev_dispatch ",
  # The `count += 1` for the space before a word (column 19; the one for the
  # word itself is column 15). `count` only decides when the loop stops early.
  # A count that is too low reads on past the cap, and `cap_report_text` then
  # cuts the text to the same first 279 chars and `…`; and a gap follows a
  # char, so `count` is still above 0 at the end. The text is the same.
  "hooks/input\\.rs:\\d+:19: replace \\+= with [-*]= in report_text$",
]
