# TEMPORARY, for #492. This file must never reach main.
name: swift mutation spike

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    name: swift mutation spike
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/cache@v4
        with:
          path: app/Vendor
          key: ghostty-vt-${{ hashFiles('scripts/fetch-ghostty-vt.sh') }}

      - name: stage libghostty-vt
        run: scripts/fetch-ghostty-vt.sh

      - name: get the tool (pinned by checksum)
        run: |
          curl -sSL -o "$RUNNER_TEMP/smt.tar.gz" https://github.com/ericodx/swift-mutation-testing/releases/download/v1.7.1/swift-mutation-testing-v1.7.1-macos.tar.gz
          echo "5799deec1cfc2f99a40e0cefde6285a5671f780b1de65439ed4eec2585f493e7  $RUNNER_TEMP/smt.tar.gz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/smt" && tar xzf "$RUNNER_TEMP/smt.tar.gz" -C "$RUNNER_TEMP/smt"
          "$RUNNER_TEMP/smt/swift-mutation-testing" --version
          "$RUNNER_TEMP/smt/swift-mutation-testing" --help
          swift --version

      - name: run
        run: |
          set +e
          go() {
            name=$1; shift
            start=$(date +%s)
            "$RUNNER_TEMP/smt/swift-mutation-testing" "$PWD/app" "$@" \
              --testing-framework xctest --operator-tier experimental --concurrency 1 \
              --timeout 300 --build-timeout 1500 --timing \
              --output "$RUNNER_TEMP/report-$name.json" --markdown-output "$RUNNER_TEMP/report-$name.md"
            echo "== $name: exit code $?; seconds $(( $(date +%s) - start ))"
            [ -f "$RUNNER_TEMP/report-$name.md" ] && cat "$RUNNER_TEMP/report-$name.md" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          SPIKE="$PWD/app/Sources/TarmacKit/Spike"
          echo "#### gate 1: write a baseline"
          go base --sources-path "$SPIKE" --write-baseline spike-baseline.json
          ls -la app/spike-baseline.json && head -c 1500 app/spike-baseline.json; echo
          echo "#### gate 2: nothing changed, expect exit 0"
          go same --sources-path "$SPIKE" --baseline spike-baseline.json --max-new-survivors 0
          echo "#### gate 3: lines moved by a comment above, expect exit 0 if a mutant is known by more than its line"
          printf '// a line\n// another line\n%s\n' "$(cat "$SPIKE/SpikeUnheld.swift")" > "$SPIKE/SpikeUnheld.swift"
          go moved --sources-path "$SPIKE" --baseline spike-baseline.json --max-new-survivors 0
          echo "#### gate 4: a new unheld function, expect exit 2"
          printf '\npublic enum SpikeNew {\n    public static func fresh(_ n: Int) -> Bool {\n        return n < 7\n    }\n}\n' >> "$SPIKE/SpikeHeld.swift"
          go added --sources-path "$SPIKE" --baseline spike-baseline.json --max-new-survivors 0
          echo "#### the kit, without the two files that send a signal"
          go kit --sources-path "$PWD/app/Sources/TarmacKit" --exclude "**/DaemonClient.swift" --exclude "**/DaemonLaunch.swift" --exclude "**/Spike/**"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-report
          path: ${{ runner.temp }}/report-*
          if-no-files-found: ignore
