# The test suites — everything `make test` runs except docs-check, which keeps
# its own workflow on purpose: it is plain node and sub-second, and must never
# queue behind a build.
#
# Both suites run on macOS, the only platform Tarmac ships on. The daemon
# resolves a term's foreground process name and live cwd through
# proc_pidpath/proc_pidinfo, macOS syscalls with `None` fallbacks elsewhere, so
# three of its integration tests cannot pass on Linux; the app is AppKit.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (cargo test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: cargo test
        run: cargo test --locked
        working-directory: core

  app:
    name: app (swift test)
    # The package targets macOS 26 (app/Package.swift), so it needs that SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The pinned libghostty-vt XCFramework is gitignored; the script verifies
      # its SHA-256, so the cache can only ever skip the download.
      - uses: actions/cache@v4
        with:
          path: app/Vendor
          key: ghostty-vt-${{ hashFiles('scripts/fetch-ghostty-vt.sh') }}

      - name: stage libghostty-vt
        run: scripts/fetch-ghostty-vt.sh

      - name: swift test
        run: swift test
        working-directory: app
