# Deterministic checks on the tree itself, apart from the test suites: a layout
# or lint rule that a tool can decide is decided here, not by a reviewer. Each
# job calls the same `make` target a contributor runs locally.
name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-rust:
    name: fmt (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # rust-toolchain.toml names the version; rustfmt comes with it.
      - name: install the pinned toolchain
        run: rustup toolchain install

      # A check that is red here on a tree that is clean locally is a formatter
      # version mismatch, so the log shows the version first.
      - name: formatter version
        run: rustc --version && cargo fmt --version

      - name: make fmt-check
        run: make fmt-check ONLY=rust

  fmt-swift:
    name: fmt (swift)
    # swift-format reads the source and compiles nothing, so the Linux
    # toolchain of the same minor version serves, and macOS runners are kept
    # for what needs AppKit (#546). The check refuses another minor version.
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    steps:
      - name: install git and make
        run: apt-get update && apt-get install -y --no-install-recommends git make ca-certificates

      - uses: actions/checkout@v4

      # The container runs as root on a checkout it did not make.
      - name: trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The check refuses a swift-format of another minor version than the one
      # this tree was formatted with, so the log shows the version first.
      - name: formatter version
        run: swift --version && swift format --version

      - name: make fmt-check
        run: make fmt-check ONLY=swift

  lint-swift:
    name: lint (swift)
    # On Linux for the reason fmt (swift) gives.
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    steps:
      - name: install git and make
        run: apt-get update && apt-get install -y --no-install-recommends git make ca-certificates

      - uses: actions/checkout@v4

      # The container runs as root on a checkout it did not make.
      - name: trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The check refuses a swift-format that lacks a rule .swift-format turns
      # on, so a rule cannot be silently off here; the log shows the version.
      - name: linter version
        run: swift format --version

      - name: make lint
        run: make lint ONLY=swift

  lint-macos:
    name: lint (swiftc, rust)
    # The two lints that compile: swiftc builds the package, which needs the
    # macOS 26 SDK (see test.yml), and the daemon's unsafe code is behind
    # macOS-only syscalls, so clippy on another platform would not compile it.
    # One job, so a push waits for one macOS runner, not two (#546). Each step
    # runs even when the one before it failed.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache@v4
        with:
          path: app/Vendor
          key: ghostty-vt-${{ hashFiles('scripts/fetch-ghostty-vt.sh') }}

      - name: install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # The known-warnings list must fit this compiler too, so the log shows
      # which one it is.
      - name: compiler version
        run: swift --version

      - name: lint (swiftc)
        if: ${{ !cancelled() }}
        run: make lint ONLY=swiftc

      - name: lint (rust)
        if: ${{ !cancelled() }}
        run: make lint ONLY=rust

  arch-check:
    name: arch-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: make arch-check
        run: make arch-check

  check-scripts:
    name: check scripts (node --test)
    # The tests run both formatters in small temporary repositories, and
    # swift-format's version matters: the Linux toolchain of the same minor
    # version serves, as for fmt (swift) (#546).
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    steps:
      - name: install git, make and curl
        run: apt-get update && apt-get install -y --no-install-recommends git make curl ca-certificates

      - uses: actions/checkout@v4

      # The container runs as root on a checkout it did not make.
      - name: trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # rustup, then the version rust-toolchain.toml pins.
      - name: install the pinned toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install

      - name: make check-test
        run: make check-test
