# Deterministic checks on the tree itself, apart from the test suites: a layout
# or lint rule that a tool can decide is decided here, not by a reviewer. Each
# job calls the same `make` target a contributor runs locally.
name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-rust:
    name: fmt (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # rust-toolchain.toml names the version; rustfmt comes with it.
      - name: install the pinned toolchain
        run: rustup toolchain install

      # A check that is red here on a tree that is clean locally is a formatter
      # version mismatch, so the log shows the version first.
      - name: formatter version
        run: rustc --version && cargo fmt --version

      - name: make fmt-check
        run: make fmt-check ONLY=rust

  fmt-swift:
    name: fmt (swift)
    # swift-format comes with the Swift toolchain, and the package needs the
    # macOS 26 image's one (see test.yml).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The check refuses a swift-format of another minor version than the one
      # this tree was formatted with, so the log shows the version first.
      - name: formatter version
        run: swift --version && swift format --version

      - name: make fmt-check
        run: make fmt-check ONLY=swift

  lint-rust:
    name: lint (rust)
    # macOS: the daemon's unsafe code is behind macOS-only syscalls, so another
    # platform would not compile it, or lint it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: make lint
        run: make lint

  check-scripts:
    name: check scripts (node --test)
    # macOS: the tests run both formatters, and swift-format's version matters.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The tests run the real formatter in small temporary repositories.
      - name: install the pinned toolchain
        run: rustup toolchain install

      - name: make check-test
        run: make check-test
