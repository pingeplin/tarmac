# Mutation testing for the Rust workspace (spec 2611.0032). cargo-mutants
# changes one expression at a time and runs the tests; a change that no test
# saw is a finding. Both jobs call `make mutants`, the target a contributor
# runs locally: the script behind it takes the diff and makes the run safe.
#
# No `paths` filter on purpose: once the pull-request job is a required check,
# a pull request whose workflow never started would wait for it for ever.
# Instead a Linux job asks the script whether there is a Rust change, and the
# macOS job runs only when there is one. A job skipped by its `if` reports as
# skipped, which a required check takes as passed (#546).
name: mutants

on:
  pull_request:
  schedule:
    # Mondays 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push to a pull request replaces its run. A weekly run is left to end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-changed:
    name: mutants (is there a Rust change)
    if: github.event_name == 'pull_request'
    # The question needs node and git only, so it costs no macOS runner.
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changed.outputs.rust }}
    steps:
      # The whole history: the answer is about the lines changed since the
      # branch left its base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: is there a Rust change
        id: changed
        run: echo "rust=$(node scripts/check/mutants.mjs --changed --base origin/${{ github.base_ref }})" >> "$GITHUB_OUTPUT"

  in-diff:
    name: mutants (rust, in diff)
    needs: rust-changed
    # Skipped only on a clear "no": when the question itself failed, the job
    # runs and the script answers it again, so a broken gate never passes a
    # Rust change unseen.
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      (needs.rust-changed.result != 'success' || needs.rust-changed.outputs.rust == 'true')
    # macOS for the reason test.yml gives: the daemon's tests need it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install the pinned toolchain
        run: rustup toolchain install

      # No build cache: the tool builds in a copy of core/ of its own, so a saved
      # core/target is never read.

      # The version scripts/check/mutants.mjs names; the script refuses another.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: make mutants
        run: make mutants BASE=origin/${{ github.base_ref }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mutants-in-diff
          path: core/mutants.out
          if-no-files-found: ignore

  all:
    name: mutants (rust, all)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install the pinned toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      # It only reports: a survivor is in the job summary and the job passes.
      # A red shard means the run itself did not work.
      - name: make mutants
        run: make mutants ALL=1 REPORT=1 SHARD=${{ matrix.shard }}/8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-all-${{ matrix.shard }}
          path: core/mutants.out
          if-no-files-found: ignore
