# Mutation testing for the Rust workspace (spec 2611.0032). cargo-mutants
# changes one expression at a time and runs the tests; a change that no test
# saw is a finding. Both jobs call `make mutants`, the target a contributor
# runs locally: the script behind it takes the diff and makes the run safe.
#
# No `paths` filter on purpose: once the pull-request job is a required check,
# a pull request that it skipped would wait for it for ever. With no Rust
# change the script passes in a second, before any tool is needed.
name: mutants

on:
  pull_request:
  schedule:
    # Mondays 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  in-diff:
    name: mutants (rust, in diff)
    if: github.event_name == 'pull_request'
    # macOS for the reason test.yml gives: the daemon's tests need it.
    runs-on: macos-latest
    steps:
      # The whole history: the mutants are those in the lines changed since the
      # branch left its base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # The version scripts/check/mutants.mjs names; the script refuses another.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: make mutants
        run: make mutants BASE=origin/${{ github.base_ref }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mutants-in-diff
          path: core/mutants.out
          if-no-files-found: ignore

  all:
    name: mutants (rust, all)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      # It only reports: a survivor is in the job summary and the job passes.
      # A red shard means the run itself did not work.
      - name: make mutants
        run: make mutants ALL=1 REPORT=1 SHARD=${{ matrix.shard }}/8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-all-${{ matrix.shard }}
          path: core/mutants.out
          if-no-files-found: ignore
